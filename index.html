<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logos/blue-favicon.png" />
    <title>InspireRise</title>
    <script>
      (function() {
        var saved = localStorage.getItem('ir_dark');
        var dark = saved !== null ? saved === 'true' : true;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
